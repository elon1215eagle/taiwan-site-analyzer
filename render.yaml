services:
  - type: web
    name: taiwan-site-analyzer
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TDX_CLIENT_ID
        sync: false
      - key: TDX_CLIENT_SECRET
        sync: false
      - key: TDX_VD_URL
        sync: false
      - key: GDO_AUTH_SECRET
        sync: false
      - key: GDO_ADMIN_EMAIL
        sync: false
      - key: GDO_ADMIN_PASSWORD
        sync: false
      - key: GDO_ADMIN_NAME
        value: GDO 總部管理員
      - key: GDO_DB_PATH
        sync: false
      - key: GDO_DATABASE_PERSISTENT
        sync: false
