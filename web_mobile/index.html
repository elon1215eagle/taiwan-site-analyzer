<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6254f3">
  <title>GDO 開店找點 AI 分析</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f8f8fb;
      --surface: #fff;
      --ink: #252936;
      --muted: #666d7d;
      --line: #dfe2eb;
      --brand: #6254f3;
      --brand-dark: #4838d1;
      --accent: #ff715b;
      --soft: #f0efff;
      --warn: #f59e0b;
      --shadow: 0 14px 34px rgba(39, 44, 72, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      line-height: 1.58;
    }
    button, input, select { font: inherit; }
    .app { width: min(760px, 100%); min-height: 100svh; margin: 0 auto; padding-bottom: 28px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    }
    .brand-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .brand { display:flex; align-items:center; gap:9px; font-size:18px; font-weight:950; }
    .brand-mark { color:var(--brand); font-size:25px; font-weight:950; }
    .menu-button { width:42px; height:42px; border:0; background:transparent; font-size:28px; color:#363b47; }
    .search-form { display:grid; grid-template-columns:1fr 92px; gap:8px; }
    .filters { display:grid; grid-template-columns:1fr 112px; gap:8px; margin-top:8px; }
    input, select {
      width:100%;
      height:46px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      color:var(--ink);
      padding:0 12px;
      outline:none;
    }
    input:focus, select:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(98,84,243,.14); }
    .primary-button { height:46px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-weight:950; cursor:pointer; }
    .quick-list { display:flex; gap:8px; overflow-x:auto; padding:10px 0 0; scrollbar-width:none; }
    .quick-list::-webkit-scrollbar { display:none; }
    .quick {
      flex:0 0 auto;
      min-height:34px;
      border:1px solid #d8d3ff;
      border-radius:999px;
      background:var(--soft);
      color:var(--brand-dark);
      padding:5px 11px;
      font-size:13px;
      font-weight:850;
      cursor:pointer;
    }
    main { padding:24px 16px 0; }
    h1 { margin:0 0 8px; font-size:32px; line-height:1.18; font-weight:950; letter-spacing:0; }
    .subtitle { margin:0; color:var(--muted); font-size:17px; }
    .section-title { margin:30px 0 10px; font-size:25px; line-height:1.25; font-weight:950; }
    .card, .insight, .store-card, .empty {
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--surface);
      box-shadow:var(--shadow);
    }
    .insight { margin-top:20px; padding:18px; }
    .insight strong { display:block; color:var(--brand-dark); font-size:20px; line-height:1.45; margin-bottom:7px; }
    .insight p, .empty p { margin:0; color:#424856; font-size:16px; }
    .metrics { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
    .metric { padding:16px; min-height:120px; }
    .metric span { display:block; font-size:15px; font-weight:900; color:#3d4350; }
    .metric strong { display:block; margin-top:7px; color:var(--brand); font-size:35px; line-height:1.15; font-weight:950; }
    .metric small { color:var(--muted); font-size:13px; }
    .map-box {
      position:relative;
      height:340px;
      margin-top:18px;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:8px;
      background:
        linear-gradient(90deg, transparent 0 22%, rgba(185,190,202,.35) 22% 23%, transparent 23% 58%, rgba(185,190,202,.35) 58% 59%, transparent 59%),
        linear-gradient(0deg, transparent 0 30%, rgba(185,190,202,.35) 30% 31%, transparent 31% 64%, rgba(185,190,202,.35) 64% 65%, transparent 65%),
        #eef0f4;
    }
    .heat { position:absolute; inset:0; background:radial-gradient(circle at 45% 55%, rgba(255,113,91,.35), transparent 22%), radial-gradient(circle at 62% 35%, rgba(255,191,71,.34), transparent 24%), radial-gradient(circle at 30% 72%, rgba(98,84,243,.18), transparent 25%); }
    .dot { position:absolute; width:18px; height:18px; border-radius:50%; background:rgba(139,125,246,.78); border:2px solid rgba(255,255,255,.78); }
    .dot.highlight { width:20px; height:20px; background:var(--accent); }
    .center-pin { position:absolute; left:50%; top:45%; width:54px; height:54px; border-radius:50% 50% 50% 8px; background:var(--brand); transform:translate(-50%,-50%) rotate(-45deg); box-shadow:0 10px 22px rgba(98,84,243,.38); z-index:3; }
    .center-pin::after { content:""; position:absolute; left:16px; top:16px; width:18px; height:18px; border-radius:50%; border:4px solid rgba(255,255,255,.9); }
    .legend { position:absolute; left:16px; bottom:16px; z-index:4; display:grid; gap:10px; min-width:168px; padding:14px 16px; border-radius:8px; background:rgba(255,255,255,.95); box-shadow:0 10px 24px rgba(39,44,72,.13); font-weight:900; }
    .legend-item { display:flex; align-items:center; gap:10px; }
    .swatch { width:16px; height:16px; border-radius:50%; background:rgba(139,125,246,.78); }
    .swatch.accent { background:var(--accent); }
    .bars { display:grid; gap:10px; }
    .bar-row { display:grid; grid-template-columns:92px 1fr 42px; align-items:center; gap:10px; font-size:14px; color:#424856; }
    .bar-track { height:12px; overflow:hidden; border-radius:999px; background:#eceef5; }
    .bar-fill { height:100%; border-radius:999px; background:linear-gradient(90deg, #b5adff, var(--brand)); }
    .store-list { display:grid; gap:10px; }
    .store-card { padding:14px; }
    .store-card h3 { margin:0 0 7px; font-size:18px; line-height:1.35; }
    .meta { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px; }
    .tag { border-radius:999px; background:var(--soft); color:var(--brand-dark); padding:3px 8px; font-size:12px; font-weight:850; }
    .store-card p, .card p { margin:0 0 8px; color:var(--muted); font-size:14px; }
    .map-link { color:var(--brand-dark); font-weight:900; text-decoration:none; }
    .card { padding:16px; }
    .note { border-left:4px solid var(--warn); padding-left:10px; color:#5d6678; font-size:14px; }
    .loading, .error { display:none; margin-top:10px; font-size:13px; font-weight:850; }
    .loading { color:var(--brand-dark); }
    .error { color:#b42318; }
    @media (max-width:420px) {
      h1 { font-size:28px; }
      .metrics { grid-template-columns:1fr; }
      .map-box { height:320px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand"><span class="brand-mark">+</span><span>GDO 開店找點 AI 分析</span></div>
        <button class="menu-button" type="button" aria-label="選單">≡</button>
      </div>
      <form id="reportForm">
        <div class="search-form">
          <input id="locationInput" autocomplete="street-address" placeholder="輸入開店地址" value="台北市松山區三民路138巷10號">
          <button class="primary-button" type="submit">分析</button>
        </div>
        <div class="filters">
          <input id="businessInput" placeholder="業態，例如：便當、炸雞、飲料" value="便當">
          <select id="radiusInput" aria-label="分析半徑">
            <option value="0.5">500 公尺</option>
            <option value="0.8" selected>800 公尺</option>
            <option value="1.0">1 公里</option>
            <option value="2.0">2 公里</option>
            <option value="3.0">3 公里</option>
          </select>
        </div>
      </form>
      <div class="quick-list" aria-label="快速業態">
        <button class="quick" type="button" data-business="便當">便當</button>
        <button class="quick" type="button" data-business="炸雞">炸雞</button>
        <button class="quick" type="button" data-business="飲料">飲料</button>
        <button class="quick" type="button" data-business="早餐">早餐</button>
        <button class="quick" type="button" data-business="火鍋">火鍋</button>
      </div>
      <div id="loading" class="loading">正在產生找點分析報告...</div>
      <div id="error" class="error"></div>
    </header>

    <main>
      <h1>開店找點分析</h1>
      <p class="subtitle">把地址轉成可判斷的營運決策：競品、營收機會、客單價、評論痛點與資料完整度。</p>
      <section id="empty" class="empty" style="margin-top:20px;"><p>輸入地址與業態後即可產生分析。營收與評論若未接資料，系統會清楚標示為推估或待接。</p></section>
      <section id="result" hidden></section>
    </main>
  </div>

  <script>
    const form = document.querySelector("#reportForm");
    const locationInput = document.querySelector("#locationInput");
    const businessInput = document.querySelector("#businessInput");
    const radiusInput = document.querySelector("#radiusInput");
    const resultEl = document.querySelector("#result");
    const emptyEl = document.querySelector("#empty");
    const loadingEl = document.querySelector("#loading");
    const errorEl = document.querySelector("#error");
    const API_BASE = location.protocol === "file:" ? "http://127.0.0.1:8787" : "";

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      queryReport();
    });

    document.querySelectorAll(".quick").forEach((button) => {
      button.addEventListener("click", () => {
        businessInput.value = button.dataset.business;
        queryReport();
      });
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }

    async function queryReport() {
      const payload = {
        location: locationInput.value.trim(),
        business_type: businessInput.value.trim(),
        radius_km: Number(radiusInput.value)
      };
      if (!payload.location || !payload.business_type) {
        showError("請輸入地址與業態。");
        return;
      }
      setLoading(true);
      hideError();
      try {
        const response = await fetch(`${API_BASE}/api/market-report`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "分析失敗");
        renderReport(data.json);
      } catch (error) {
        showError(error.message || "分析失敗，請確認後端服務是否啟動。");
      } finally {
        setLoading(false);
      }
    }

    function renderReport(data) {
      emptyEl.hidden = true;
      resultEl.hidden = false;
      resultEl.innerHTML = `
        <section class="insight">
          <strong>${escapeHtml(data.summary.conclusion)}</strong>
          <p>${escapeHtml(data.summary.data_status)}</p>
        </section>

        <div class="metrics">
          <article class="card metric"><span>同類店家</span><strong>${data.summary.same_type_count}</strong><small>${data.radius_km} 公里內</small></article>
          <article class="card metric"><span>餐飲總店數</span><strong>${data.summary.all_food_count}</strong><small>競爭密度：${escapeHtml(data.summary.density_level)}</small></article>
          <article class="card metric"><span>營收機會</span><strong>${escapeHtml(data.revenue_performance.opportunity_level)}</strong><small>${escapeHtml(data.revenue_performance.data_status)}</small></article>
          <article class="card metric"><span>客單定位</span><strong>${escapeHtml(data.average_ticket_distribution.position)}</strong><small>需菜單/POS 校正</small></article>
        </div>

        <h2 class="section-title">同業與人流分布</h2>
        <p class="subtitle">以開店地址為中心，觀察同類店與餐飲熱區集中狀況。</p>
        <div class="map-box">
          <span class="heat"></span>
          ${renderDots(data.summary.same_type_count, data.summary.all_food_count)}
          <span class="center-pin"></span>
          <div class="legend">
            <div class="legend-item"><span class="swatch accent"></span><span>${escapeHtml(data.business_type)}</span></div>
            <div class="legend-item"><span class="swatch"></span><span>其他餐飲</span></div>
          </div>
        </div>

        <h2 class="section-title">營收表現</h2>
        <section class="card">
          <p><strong>推估月營收區間：</strong>${money(data.revenue_performance.estimated_monthly_revenue_range[0])} - ${money(data.revenue_performance.estimated_monthly_revenue_range[1])}</p>
          <p class="note">${escapeHtml(data.revenue_performance.basis)}</p>
        </section>

        <h2 class="section-title">月營收分布</h2>
        <section class="card bars">${data.monthly_revenue_distribution.map(barRow).join("")}</section>

        <h2 class="section-title">客單價分布</h2>
        <section class="card bars">
          <p><strong>${escapeHtml(data.average_ticket_distribution.position)}</strong></p>
          ${data.average_ticket_distribution.distribution.map(barRow).join("")}
          <p class="note">${escapeHtml(data.average_ticket_distribution.basis)}</p>
        </section>

        <h2 class="section-title">附近前三名同類店家</h2>
        <section class="store-list">
          ${data.top_competitors.length ? data.top_competitors.map(competitorCard).join("") : `<article class="empty"><p>查無足夠同類競品資料。</p></article>`}
        </section>

        <h2 class="section-title">好評與差評摘要</h2>
        <section class="card">
          <p><strong>好評方向</strong></p>
          ${data.review_summary.positive.map(item => `<p>+ ${escapeHtml(item)}</p>`).join("")}
          <p><strong>差評/缺口</strong></p>
          ${data.review_summary.negative.map(item => `<p>- ${escapeHtml(item)}</p>`).join("")}
          <p class="note">${escapeHtml(data.review_summary.data_status)}</p>
        </section>

        <h2 class="section-title">資料完整度</h2>
        <section class="card">${data.data_requirements.map(item => `<p>- ${escapeHtml(item)}</p>`).join("")}</section>
      `;
    }

    function renderDots(sameTypeCount, allFoodCount) {
      const dots = [];
      const total = Math.min(Math.max(allFoodCount, 16), 95);
      for (let index = 0; index < total; index += 1) {
        const x = 8 + ((index * 37) % 84);
        const y = 10 + ((index * 53) % 78);
        const highlight = index < sameTypeCount ? " highlight" : "";
        dots.push(`<span class="dot${highlight}" style="left:${x}%;top:${y}%"></span>`);
      }
      return dots.join("");
    }

    function barRow(item) {
      const label = item.range || item.level;
      const name = item.level || item.range;
      return `
        <div class="bar-row">
          <span>${escapeHtml(name)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Number(item.share) || 0}%"></div></div>
          <span>${Number(item.share) || 0}%</span>
        </div>
        <p style="margin-top:-4px;">${escapeHtml(label)}</p>
      `;
    }

    function competitorCard(item) {
      const rating = item.rating ?? "未取得";
      const reviews = item.user_ratings_total ?? "未取得";
      const distance = item.distance_km === null || item.distance_km === undefined ? "距離未取得" : `${item.distance_km} km`;
      return `
        <article class="store-card">
          <h3>${item.rank}. ${escapeHtml(item.name)}</h3>
          <div class="meta">
            <span class="tag">評分 ${escapeHtml(rating)}</span>
            <span class="tag">評論 ${escapeHtml(reviews)}</span>
            <span class="tag">${escapeHtml(distance)}</span>
          </div>
          <p>${escapeHtml(item.address || "未提供地址")}</p>
          <p><strong>優勢：</strong>${escapeHtml(item.strength)}</p>
          <p><strong>風險：</strong>${escapeHtml(item.risk)}</p>
          ${reviewLines("好評", item.review_positive)}
          ${reviewLines("差評/缺口", item.review_negative)}
          ${item.maps_url ? `<a class="map-link" href="${escapeHtml(item.maps_url)}" target="_blank" rel="noreferrer">開啟地圖</a>` : ""}
        </article>
      `;
    }

    function reviewLines(title, items) {
      if (!items || !items.length) return "";
      return `<p><strong>${escapeHtml(title)}：</strong>${items.map(escapeHtml).join("；")}</p>`;
    }

    function money(value) {
      return `${Math.round(Number(value) / 10000)} 萬`;
    }

    function setLoading(isLoading) { loadingEl.style.display = isLoading ? "block" : "none"; }
    function showError(message) { errorEl.textContent = message; errorEl.style.display = "block"; }
    function hideError() { errorEl.textContent = ""; errorEl.style.display = "none"; }
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
