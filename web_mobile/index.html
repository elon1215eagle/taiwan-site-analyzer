<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3a6f">
  <title>GDO 選址決策中心</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="loginView" class="login-shell">
    <section class="login-panel" aria-labelledby="loginTitle">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div><strong>GDO</strong><span>選址決策中心</span></div>
      </div>
      <h1 id="loginTitle">登入營運工作台</h1>
      <form id="loginForm" class="stack">
        <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
        <label>密碼<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit"><i data-lucide="log-in"></i>登入</button>
      </form>
      <p id="loginError" class="form-error" role="alert"></p>
      <p class="legal-note">吉多國際餐飲／LAIGDO 內部及加盟展店專用</p>
    </section>
  </div>

  <div id="appView" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand-lockup compact">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div><strong>GDO</strong><span>選址決策中心</span></div>
      </div>
      <nav class="side-nav" aria-label="主要功能">
        <button class="nav-item active" data-view="address"><i data-lucide="map-pin"></i><span>指定地址分析</span></button>
        <button class="nav-item" data-view="reverse"><i data-lucide="search"></i><span>反查推薦區域</span></button>
        <button class="nav-item" data-view="cases"><i data-lucide="folder-kanban"></i><span>選址案件</span></button>
        <button class="nav-item" data-view="notifications"><i data-lucide="bell"></i><span>站內通知</span><b id="notificationBadge" hidden>0</b></button>
      </nav>
      <div class="user-block">
        <span id="userAvatar">G</span>
        <div><strong id="userName">使用者</strong><small id="userRole">角色</small></div>
        <button id="logoutButton" class="icon-button" title="登出" aria-label="登出"><i data-lucide="log-out"></i></button>
      </div>
    </aside>

    <div class="workspace">
      <header class="mobile-header">
        <div class="brand-lockup compact">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <div><strong>GDO</strong><span>選址決策中心</span></div>
        </div>
        <button id="mobileMenuButton" class="icon-button" title="功能選單" aria-label="功能選單"><i data-lucide="menu"></i></button>
      </header>

      <main>
        <section id="addressView" class="view active-view">
          <header class="page-heading">
            <div><span class="eyebrow">SITE EVIDENCE</span><h1>指定地址分析</h1><p>候選店面市場證據與初篩決策</p></div>
            <div class="heading-actions">
              <button id="printButton" class="button secondary" type="button" hidden><i data-lucide="file-down"></i>匯出 PDF</button>
            </div>
          </header>
          <form id="addressForm" class="tool-panel address-form">
            <label class="wide">候選店面地址<input id="addressInput" autocomplete="street-address" placeholder="縣市、行政區、路段及門牌" required></label>
            <label>業態<select id="businessSelect" required></select></label>
            <label>月租金<input id="rentInput" type="number" min="0" inputmode="numeric" placeholder="元"></label>
            <label>坪數<input id="areaInput" type="number" min="0.1" step="0.1" inputmode="decimal" placeholder="坪"></label>
            <button class="button primary analyze-button" type="submit"><i data-lucide="scan-search"></i>開始分析</button>
          </form>
          <div id="addressState" class="state-panel">
            <i data-lucide="map-pinned"></i>
            <strong>尚未產生地址報告</strong>
          </div>
          <div id="reportResult" hidden></div>
        </section>

        <section id="reverseView" class="view">
          <header class="page-heading">
            <div><span class="eyebrow">AREA DISCOVERY</span><h1>反查推薦區域</h1><p>先選行政區，再找可定位道路熱點</p></div>
          </header>
          <form id="reverseForm" class="tool-panel reverse-form">
            <label>業態<select id="reverseBusiness" required></select></label>
            <label>縣市<select id="countySelect" required></select></label>
            <label>行政區<input id="districtInput" placeholder="第一階段可留白"></label>
            <button class="button primary" type="submit"><i data-lucide="radar"></i>產生排序</button>
          </form>
          <div id="reverseState" class="state-panel">
            <i data-lucide="route"></i>
            <strong>尚未產生區域排序</strong>
          </div>
          <div id="reverseResult" hidden></div>
        </section>

        <section id="casesView" class="view">
          <header class="page-heading">
            <div><span class="eyebrow">CASE CONTROL</span><h1>選址案件</h1><p>候選店面、現勘、比較與送審</p></div>
            <div class="heading-actions">
              <button id="accountButton" class="button secondary" type="button" hidden><i data-lucide="users"></i>帳號管理</button>
              <button id="newCaseButton" class="button primary" type="button"><i data-lucide="folder-plus"></i>建立案件</button>
            </div>
          </header>
          <form id="accountForm" class="tool-panel account-form" hidden>
            <label>姓名<input id="accountName" required></label>
            <label>Email<input id="accountEmail" type="email" required></label>
            <label>角色<select id="accountRole"><option value="franchisee">加盟主</option><option value="developer">區域開發人員</option><option value="admin">總部管理員</option></select></label>
            <label>初始密碼<input id="accountPassword" type="password" minlength="10" required></label>
            <button class="button primary" type="submit"><i data-lucide="user-plus"></i>建立帳號</button>
          </form>
          <form id="caseForm" class="tool-panel case-form" hidden>
            <label>案件名稱<input id="caseTitle" required placeholder="例如：高雄三民炸雞展店"></label>
            <label>業態<select id="caseBusiness" required></select></label>
            <label>縣市<select id="caseCounty"></select></label>
            <button class="button primary" type="submit"><i data-lucide="save"></i>儲存案件</button>
          </form>
          <div id="caseList" class="case-grid"></div>
          <div id="caseDetail"></div>
        </section>

        <section id="notificationsView" class="view">
          <header class="page-heading">
            <div><span class="eyebrow">INBOX</span><h1>站內通知</h1><p>案件送審、補件、留言與結案</p></div>
          </header>
          <div id="notificationList" class="notification-list"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="busyOverlay" class="busy-overlay" hidden><span class="spinner"></span><strong>正在取得市場證據</strong></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
